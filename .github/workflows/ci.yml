name: Build and release

on:
  push:
    branches:
      - '**'
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Serialize main builds so version selection sees the preceding completed release.
# SelectRelease compares against the last published source, so a queued docs-only
# push cannot hide app changes when GitHub replaces an older pending run.
concurrency:
  group: morupixel-ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build, self-test, and package
    # Server 2025 Windows.Data.Pdf destroys its WARP device after native thread-pool
    # shutdown (CPdfStatics -> d3d10warp!Task::ScheduleTask, STATUS_INVALID_PARAMETER).
    # Use the supported stable image; source and portable suites still must exit 0.
    runs-on: windows-2022
    timeout-minutes: 20
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      publish: ${{ steps.version.outputs.publish }}
      automatic: ${{ steps.version.outputs.automatic }}
      commit: ${{ steps.version.outputs.commit }}

    steps:
      - name: Check out source and release tags
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Test release policy
        shell: pwsh
        run: .\scripts\TestReleaseAutomation.ps1

      - name: Select package and release version
        id: version
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: .\scripts\SelectRelease.ps1

      - name: Build
        shell: pwsh
        run: .\scripts\Build.ps1 -Configuration Release

      - name: Run self-tests
        shell: pwsh
        run: .\scripts\Test.ps1 -Configuration Release -SkipBuild

      # Publish.ps1 runs the packaged Morupixel.exe --self-test before creating its ZIP.
      - name: Publish and test portable package
        shell: pwsh
        env:
          PACKAGE_VERSION: ${{ steps.version.outputs.version }}
        run: .\scripts\Publish.ps1 -Configuration Release -Version $env:PACKAGE_VERSION -SkipTests

      - name: Upload tested package artifact
        uses: actions/upload-artifact@v4
        with:
          name: morupixel-package
          path: |
            release/*.zip
            release/*.zip.sha256
          if-no-files-found: error
          retention-days: 14

      - name: Keep source and packaged test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: morupixel-test-reports
          path: |
            artifacts/test-results/self-test.txt
            artifacts/published-self-test/self-test.txt
          if-no-files-found: ignore
          retention-days: 30

      - name: Record Windows crash details
        if: failure()
        shell: pwsh
        run: |
          Get-WinEvent -FilterHashtable @{ LogName='Application'; StartTime=(Get-Date).AddMinutes(-15) } -ErrorAction SilentlyContinue |
            Where-Object { $_.ProviderName -in @('Application Error', '.NET Runtime', 'Windows Error Reporting') } |
            Select-Object -First 8 TimeCreated, ProviderName, Message | Format-List

      - name: Capture native failure for diagnosis
        if: failure()
        timeout-minutes: 3
        shell: pwsh
        run: |
          $diagnostics = Join-Path $PWD 'artifacts/native-diagnostics'
          New-Item -ItemType Directory -Path $diagnostics -Force | Out-Null
          $executable = Get-ChildItem 'src/bin/Release' -Filter Morupixel.exe -Recurse | Select-Object -First 1
          $debugger = Get-ChildItem 'C:/Program Files (x86)/Windows Kits' -Filter cdb.exe -Recurse -ErrorAction SilentlyContinue | Where-Object { $_.FullName -match 'x64' } | Select-Object -First 1
          if ($executable -and $debugger) {
            # Only function names and addresses are logged. Never create or upload memory dumps.
            & $debugger.FullName -G -y 'srv*https://msdl.microsoft.com/download/symbols' -c 'sxe -c "k; q" 0xc000000d; g' $executable.FullName --self-test (Join-Path $diagnostics 'reproduction.txt')
          }
          # This is diagnostic only; the original failed test step still fails the job.
          exit 0

  release:
    name: Publish verified GitHub release
    if: needs.build.outputs.publish == 'true' && github.event_name == 'push'
    needs: build
    runs-on: windows-2022
    timeout-minutes: 10
    concurrency:
      group: morupixel-publish
      queue: max
      cancel-in-progress: false
    permissions:
      contents: write

    steps:
      - name: Check out the tested source
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.build.outputs.commit }}
          persist-credentials: false

      - name: Download tested package artifact
        uses: actions/download-artifact@v4
        with:
          name: morupixel-package
          path: release-download

      - name: Upload draft, verify checksums, and publish
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          PACKAGE_VERSION: ${{ needs.build.outputs.version }}
          SOURCE_COMMIT: ${{ needs.build.outputs.commit }}
          AUTOMATIC_RELEASE: ${{ needs.build.outputs.automatic }}
        run: |
          $arguments = @{
            Version = $env:PACKAGE_VERSION
            Commit = $env:SOURCE_COMMIT
            PackageDirectory = 'release-download'
            Automatic = ($env:AUTOMATIC_RELEASE -eq 'true')
          }
          .\scripts\PublishGitHubRelease.ps1 @arguments
